<?xml version="1.0"?>
<ItemRandomization>
	<Maps>
		<!--
			EXPLANATION
			
			MAP
			Name		-	Must match the name returned by pMap.GetName()
			
			ITEM 
			Name 		-	Name of the type of randomized prop 
			Count		-	How many of this type should exist in the map
		-->
		
		<Map Name="arsenal">
			<ItemType Name="Brick" 				Count="1"	/>
			<ItemType Name="ExplosiveBarrel" 	Count="2"	/>
			<ItemType Name="GasCanister" 		Count="4"	/>
		</Map>
		<Map Name="tunnels">
			<ItemType Name="Brick" 				Count="1"	/>
			<ItemType Name="ExplosiveBarrel" 	Count="2"	/>
			<ItemType Name="GasCanister" 		Count="0"	/>
		</Map>
		<Map Name="maintenance">
			<ItemType Name="Brick" 				Count="2"	/>
			<ItemType Name="ExplosiveBarrel" 	Count="4"	/>
			<ItemType Name="GasCanister" 		Count="3"	/>
		</Map>
		<Map Name="officer_hub">
			<ItemType Name="Brick" 				Count="0"	/>
			<ItemType Name="ExplosiveBarrel" 	Count="3"	/>
			<ItemType Name="GasCanister" 		Count="3"	/>
		</Map>
		<Map Name="prison">
			<ItemType Name="Brick" 				Count="1"	/>
			<ItemType Name="ExplosiveBarrel" 	Count="2"	/>
			<ItemType Name="GasCanister" 		Count="1"	/>
		</Map>
		<Map Name="soldier_quarters">
			<ItemType Name="Brick" 				Count="3"	/>
			<ItemType Name="ExplosiveBarrel" 	Count="3"	/>
			<ItemType Name="GasCanister" 		Count="1"	/>
		</Map>
	</Maps>
</ItemRandomization>