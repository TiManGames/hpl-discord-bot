<?xml version="1.0"?>
<Settings>
    
    <!--
    Entry: Difficulty Setting Entry
        ID: The ID of the entry. Must be unique and match the eGameDifficultySetting enum in helpers/helper_game.hps!
        Name: The language name entry to display in the UI.
        Type: The data type of the entry (Bool, Int, Float).
        ControlType: The type of control this setting appears with in the menu (Slider, Switch, Checkbox).
        Implemented : For development only. If false or missing the label will be greyed out indicating a WIP state. Set as true when fully implemented. 
        
        A setting can rely on the state of another setting before its effect is applied to the game. If a setting that relies on another doesn't meet the required xreteria it'll be disabled in the main menu. 
        The following flags are for defining such behavior:
            ReliesOn_SettingID: The ID of the setting that this setting relies on. Use the ID of the other setting to define it. 
            ReliesOn_DisablingValueID: The value ID of the setting that this setting relies on that disables the effect of this setting. Use the related value ID to define it. 

    Values: The different values the entry can take. 
        ID: The ID of the value entry. Must be unique.
        Name: The language name entry of the value to display in the UI.
        Value: The actual value to use in the code.
    
    PresetValueIDs: PresetValueIDs: The Value "ID" from the "Values" list to use for each preset difficulty mode. 
        0=false, 1=true for the Bool type entries. 
        Easy: The "Value" ID to use for Easy Mode.
        Normal: The "Value" ID to use for Normal Mode.
        Hard: The "Value" ID to use for Hard Mode.
        VeryHard: The "Value" ID to use for Very Hard Mode.
    -->

