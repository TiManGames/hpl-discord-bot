<DatabaseSettings AllowLocalId="True">
  <OutputTypes>
    <OutputType Name="Voice Subject" />
    <OutputType Name="Description" />
    <OutputType Name="Script Callback" />
  </OutputTypes>
  <Triggers>
    <Trigger Name="PlayerCollide" Description="CollideEntity: Entity that is collided with. 
If the player collides with an entity. Note that this one is not checked every update and might miss very brief collisions">
      <Criteria Name="CollideEntity"/>
    </Trigger>
    <Trigger Name="PlayerLeaveCollide" Description="CollideEntity: Entity that player has collided with.
Triggered when player stops colliding with an entity. Mostly useful to check if player leaves an area">
      <Criteria Name="CollideEntity"/>
    </Trigger>
    <Trigger Name="PlayerInteract" Description="InteractEntity: Entity that is interacted with.
If the player interacts with an entity. Note that this is triggered through the basic script">
      <Criteria Name="InteractEntity"/>
    </Trigger>
    <Trigger Name="PlayerLookAt" Description="LookAtEntity: Entity that is look upon.
LookAtDistance: The distance to the entity that is looked upon.
LookAtDuration: The amount of time the player has looked at the entity.
If the player looks at an entity">
      <Criteria Name="LookAtEntity"/>
      <Criteria Name="LookAtDistance"/>
      <Criteria Name="LookAtDuration"/>
    </Trigger>
    <Trigger Name="VoiceLineOver" Description="VoiceSubject: The name of the subject
VoiceLine: The name of the line
When a voice line is over.">
      <Criteria Name="VoiceSubject"/>
      <Criteria Name="VoiceLine"/>
    </Trigger>
    <Trigger Name="VoiceSoundOver" Description="VoiceSubject: The name of the subject.
VoiceLine: The name of the line
VoiceSoundIndex: The index of the sound that was just completed.
When a voice sound file is over">
      <Criteria Name="VoiceSubject"/>
      <Criteria Name="VoiceLine"/>
      <Criteria Name="VoiceSoundIndex"/>
    </Trigger>
    <Trigger Name="VoiceIdle" Description="VoiceIdleDuration: The time the voice has been idle.
VoiceCharacterIdleDuration_[character]: The idle time for a specific character.
Called every 3rd seconds when there is no voice playing">
      <Criteria Name="VoiceIdleDuration"/>
      <Criteria Name="VoiceCharacterIdleDuration_[character]"/>
    </Trigger>
  </Triggers>
  <FacialExpressions>
    <FacialExpression Name="Smile" Animation="Emotion_Smile" />
    <FacialExpression Name="Sad" Animation="Emotion_Sad" />
    <FacialExpression Name="Happy" Animation="Emotion_Happy" />
    <FacialExpression Name="Surprised" Animation="Emotion_Surprised" />
    <FacialExpression Name="Wink" Animation="Emotion_Wink" />
    <FacialExpression Name="Wondering" Animation="Emotion_Wondering" />
    <FacialExpression Name="Angry" Animation="Emotion_Angry" />
    <FacialExpression Name="Worried" Animation="Emotion_Worried" />
    <FacialExpression Name="Scared" Animation="Emotion_Scared" />
  </FacialExpressions>
</DatabaseSettings>
	