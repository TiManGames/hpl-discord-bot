<?xml version="1.0"?>
<StruggleFlashes>
	<!-- 
		Group: A Group of materials to be flashed based on game progression.
		Flash: Holds a link to a texture file to be flashed on the screen.
			TextureFile = Name of the texture file to be used.
	-->
	<Groups>
		<!-- Early Game -->
		<Group GameProgression="0">
			<Flashes>
				<Flash TextureFile="flashes-3.dds" />
				<Flash TextureFile="flashes-4.dds" />
				<Flash TextureFile="flashes-10.dds" />
				<Flash TextureFile="flashes-6.dds" />
				<Flash TextureFile="flashes-5.dds" />
				<Flash TextureFile="flashes-8.dds" />
				<Flash TextureFile="flashes-7.dds" />
				<Flash TextureFile="flashes-9.dds" />
			</Flashes>
		</Group>
		
		<!-- TTH Onwards -->
		<Group GameProgression="1">
			<Flashes>
				<Flash TextureFile="flashes-12.dds" />
				<Flash TextureFile="flashes-13.dds" />
				<Flash TextureFile="flashes-14.dds" />
				<Flash TextureFile="flashes-15.dds" />
				<Flash TextureFile="flashes-16.dds" />
				<Flash TextureFile="flashes-17.dds" />
				<Flash TextureFile="flashes-18A.dds" />
				<Flash TextureFile="flashes-18B.dds" />
			</Flashes>
		</Group>
		
		<!-- DWF Onwards -->
		<Group GameProgression="2">
			<Flashes>
				<Flash TextureFile="flashes-21.dds" />
				<Flash TextureFile="flashes-22.dds" />
				<Flash TextureFile="flashes-23.dds" />
				<Flash TextureFile="flashes-24A.dds" />
				<Flash TextureFile="flashes-24C.dds" />
			</Flashes>
		</Group>
		
		<!-- Undercity: Early Struggles -->
		<Group GameProgression="3">
			<Flashes>
				<Flash TextureFile="flashes-27A.dds" />
				<Flash TextureFile="flashes-27B.dds" />
				<Flash TextureFile="flashes-28.dds" />
				<Flash TextureFile="flashes-29.dds" />
				<Flash TextureFile="flashes-30.dds" />
			</Flashes>
		</Group>
		
		<!-- Undercity: Late Struggles - Destruction -->
		<Group GameProgression="4">
			<Flashes>
				<Flash TextureFile="flashes-32.dds" />
				<Flash TextureFile="flashes-33.dds" />
			</Flashes>
		</Group>
		
		<!-- Undercity: Late Struggles - Portal -->
		<Group GameProgression="5">
			<Flashes>
				<Flash TextureFile="flashes-33.dds" />
				<Flash TextureFile="flashes-24A.dds" />
				<Flash TextureFile="flashes-24C.dds" />
			</Flashes>
		</Group>
		
		<!-- Undercity: Late Struggles - Ghoul -->
		<Group GameProgression="6">
			<Flashes>
				<Flash TextureFile="flashes-38.dds" />
			</Flashes>
		</Group>
		
		<!-- Undercity: Final Memories Flashes -->
		<Group GameProgression="7">
			<Flashes>
				<Flash TextureFile="flashes-27a.dds" />
			</Flashes>
		</Group>
		
	</Groups>
</StruggleFlashes>